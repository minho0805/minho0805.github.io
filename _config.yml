title: "minho.dev"
description: "개발하며 배운 것들을 기록합니다"
author:
  name: "minho"
  email: "2022305011@skuniv.ac.kr"
  github: "minho0805"
  bio: "서경대학교 컴퓨터공학과"

url: ""
baseurl: ""

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"

plugins:
  - jekyll-feed
  - jekyll-sitemap

permalink: /:year/:month/:day/:title/

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
